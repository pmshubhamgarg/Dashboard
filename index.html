<script>
  window.__DATA__ = [{"project": "Shell B2B Commerce", "solution": "Commerce", "region": "EMEA", "quarter": "Q1 2025", "phase": "Discovery & Design", "activity": "Discovery Questionnaire creation", "pm": "Sowmya Mathews", "baseHr": 15, "curHr": 10, "baseFreq": 1, "curFreq": 1, "quality": 3, "notes": "AI drafted questionnaire in 1 day rather than 2 days", "tool": ""}, {"project": "Shell B2B Commerce", "solution": "Commerce", "region": "EMEA", "quarter": "Q1 2025", "phase": "Discovery & Design", "activity": "Standardised user story generation (AC + edge cases)", "pm": "Sowmya Mathews", "baseHr": 4, "curHr": 2, "baseFreq": 10, "curFreq": 10, "quality": 3, "notes": "GPT-4 generated AC + edge cases; PM reviewed ", "tool": ""}, {"project": "Shell B2B Commerce", "solution": "Commerce", "region": "EMEA", "quarter": "Q1 2025", "phase": "Discovery & Design", "activity": "BRD creation", "pm": "Sowmya Mathews", "baseHr": 40, "curHr": 20, "baseFreq": 1, "curFreq": 1, "quality": 4, "notes": "AI structured outline + gap analysis saved hrs", "tool": ""}, {"project": "Shell B2B Commerce", "solution": "Commerce", "region": "EMEA", "quarter": "Q4 2025", "phase": "Implementation", "activity": "Requirements understanding", "pm": "Sowmya Mathews", "baseHr": 3, "curHr": 1, "baseFreq": 15, "curFreq": 15, "quality": 5, "notes": "AI summarised requirement docs per sprint", "tool": ""}, {"project": "Shell B2B Commerce", "solution": "Commerce", "region": "EMEA", "quarter": "Q4 2025", "phase": "Implementation", "activity": "Coding and refactoring", "pm": "Sowmya Mathews", "baseHr": 6, "curHr": 3, "baseFreq": 15, "curFreq": 15, "quality": 5, "notes": "AI pair-coding reduced avg ticket time by 50%", "tool": ""}, {"project": "Shell B2B Commerce", "solution": "Commerce", "region": "EMEA", "quarter": "Q1 2025", "phase": "Discovery & Design", "activity": "TDD / EATSD creation", "pm": "Sowmya Mathews", "baseHr": 40, "curHr": 20, "baseFreq": 1, "curFreq": 1, "quality": 4, "notes": "AI pre-review flagged 80% of issues before human review", "tool": ""}, {"project": "Shell B2B Commerce", "solution": "Commerce", "region": "EMEA", "quarter": "Q3 2025", "phase": "Project Management", "activity": "Weekly status creation", "pm": "Sowmya Mathews", "baseHr": 3, "curHr": 2, "baseFreq": 4, "curFreq": 4, "quality": 4, "notes": "AI compiled status from Jira + meeting notes", "tool": ""}, {"project": "Shell B2B Commerce", "solution": "Commerce", "region": "EMEA", "quarter": "Q3 2025", "phase": "Project Management", "activity": "Risk extraction (notes/Jira/Slack)", "pm": "Sowmya Mathews", "baseHr": 4, "curHr": 3, "baseFreq": 4, "curFreq": 4, "quality": 3, "notes": "AI surfaced 25% more risks than manual review", "tool": ""}, {"project": "Shell B2B Commerce", "solution": "Commerce", "region": "EMEA", "quarter": "Q4 2025", "phase": "Discovery & Design", "activity": "Test Strategy creation", "pm": "Sowmya Mathews", "baseHr": 20, "curHr": 10, "baseFreq": 1, "curFreq": 1, "quality": 3, "notes": "AI generated strategy doc with good quality and with time savings", "tool": ""}, {"project": "Shell B2B Commerce", "solution": "Commerce", "region": "EMEA", "quarter": "Q4 2025", "phase": "Discovery & Design", "activity": "Change request documentation", "pm": "Sowmya Mathews", "baseHr": 5, "curHr": 3, "baseFreq": 5, "curFreq": 5, "quality": 3, "notes": "Compared with SOW and Discovery docs", "tool": ""}, {"project": "PIF", "solution": "AEM", "region": "EMEA", "quarter": "Q1 2025", "phase": "Discovery & Design", "activity": "Test Strategy creation", "pm": "Sandeep Menon", "baseHr": 0, "curHr": 0, "baseFreq": 0, "curFreq": 0, "quality": 0, "notes": "", "tool": ""}, {"project": "PIF", "solution": "AEM", "region": "EMEA", "quarter": "Q2 2025", "phase": "Implementation", "activity": "Unit testing", "pm": "Sandeep Menon", "baseHr": 0, "curHr": 0, "baseFreq": 0, "curFreq": 0, "quality": 0, "notes": "", "tool": ""}, {"project": "PIF", "solution": "AEM", "region": "EMEA", "quarter": "Q2 2025", "phase": "Implementation", "activity": "Debugging and performance", "pm": "Sandeep Menon", "baseHr": 0, "curHr": 0, "baseFreq": 0, "curFreq": 0, "quality": 0, "notes": "", "tool": ""}, {"project": "PIF", "solution": "AEM", "region": "EMEA", "quarter": "Q3 2025", "phase": "Project Management", "activity": "Meetings notes within 24 hrs", "pm": "Sandeep Menon", "baseHr": 0, "curHr": 0, "baseFreq": 0, "curFreq": 0, "quality": 0, "notes": "", "tool": ""}, {"project": "PIF", "solution": "AEM", "region": "EMEA", "quarter": "Q3 2025", "phase": "Project Management", "activity": "Proactive risk/issue logging", "pm": "Sandeep Menon", "baseHr": 0, "curHr": 0, "baseFreq": 0, "curFreq": 0, "quality": 0, "notes": "", "tool": ""}, {"project": "PIF", "solution": "AEM", "region": "EMEA", "quarter": "Q1 2025", "phase": "Discovery & Design", "activity": "Change request documentation", "pm": "Sandeep Menon", "baseHr": 0, "curHr": 0, "baseFreq": 0, "curFreq": 0, "quality": 0, "notes": "", "tool": ""}, {"project": "H3G", "solution": "AEP", "region": "EMEA", "quarter": "Q1 2025", "phase": "Discovery & Design", "activity": "CR: BRD vs SOW comparison", "pm": "Veena Pillai", "baseHr": 0, "curHr": 0, "baseFreq": 0, "curFreq": 0, "quality": 0, "notes": "", "tool": ""}, {"project": "H3G", "solution": "AEP", "region": "EMEA", "quarter": "Q2 2025", "phase": "Implementation", "activity": "User story reopen rate (req gaps)", "pm": "Veena Pillai", "baseHr": 0, "curHr": 0, "baseFreq": 0, "curFreq": 0, "quality": 0, "notes": "", "tool": ""}, {"project": "H3G", "solution": "AEP", "region": "EMEA", "quarter": "Q3 2025", "phase": "Project Management", "activity": "Action tracker maintenance", "pm": "Veena Pillai", "baseHr": 0, "curHr": 0, "baseFreq": 0, "curFreq": 0, "quality": 0, "notes": "", "tool": ""}, {"project": "H3G", "solution": "AEP", "region": "EMEA", "quarter": "Q3 2025", "phase": "Project Management", "activity": "Project plan creation", "pm": "Veena Pillai", "baseHr": 0, "curHr": 0, "baseFreq": 0, "curFreq": 0, "quality": 0, "notes": "", "tool": ""}, {"project": "CenterParks", "solution": "AEM", "region": "EMEA", "quarter": "Q2 2025", "phase": "Next Phase Recs", "activity": "Next phase ideas / recommendations", "pm": "Tanu Gupta", "baseHr": 0, "curHr": 0, "baseFreq": 0, "curFreq": 0, "quality": 0, "notes": "", "tool": ""}];
  window.__COST_RATE__ = 95;
  window.__GENERATED_AT__ = "2026-05-07";
</script>
<script type="text/babel" data-presets="react">
const { useState, useMemo } = React;
const {
  BarChart, Bar, XAxis, YAxis, CartesianGrid, Tooltip, ResponsiveContainer,
  RadarChart, Radar, PolarGrid, PolarAngleAxis, PolarRadiusAxis,
  AreaChart, Area, LineChart, Line, Legend, Cell, ScatterChart, Scatter, ZAxis
} = Recharts;

// ── DATA ──────────────────────────────────────────────────────────────────────
const ACTIVITIES_BY_PHASE = {
  "Discovery & Design": [
    "Discovery Questionnaire creation",
    "Standardised user story generation (AC + edge cases)",
    "BRD creation","TDD / EATSD creation","Test Strategy creation",
    "Change request documentation","CR: BRD vs SOW comparison",
  ],
  "Implementation": [
    "Requirements understanding","Coding and refactoring","Debugging and performance",
    "Unit testing","User story reopen rate (req gaps)","Defect logging (req / code issues)","Code / PR reviews",
  ],
  "Project Management": [
    "Proactive risk/issue logging","Risk extraction (notes/Jira/Slack)",
    "Meetings notes within 24 hrs","Weekly status creation","Action tracker maintenance","Project plan creation",
  ],
  "Next Phase Recs": ["Next phase ideas / recommendations"],
};

const COST_RATE = window.__COST_RATE__;
const RAW = window.__DATA__.map(d => {
  const baseTotal = d.baseHr * d.baseFreq;
  const curTotal  = d.curHr  * d.curFreq;
  const saved = Math.max(0, baseTotal - curTotal);
  const pct   = baseTotal > 0 ? Math.round((saved / baseTotal) * 1000) / 10 : 0;
  return { ...d, saved, pct, cost: saved * COST_RATE };
});

const SOLUTIONS = ["All","AEM","CSC","AEP","Commerce"];
const REGIONS   = ["All","NA","EMEA","APAC","LATAM"];
const QUARTERS  = ["All","Q1 2025","Q2 2025","Q3 2025","Q4 2025","Q1 2026"];
const PHASES    = ["All","Discovery & Design","Implementation","Project Management","Next Phase Recs"];

const PHASE_COLOR  = { "Discovery & Design":"#3B82F6","Implementation":"#22C55E","Project Management":"#F59E0B","Next Phase Recs":"#A855F7" };
const PHASE_LIGHT  = { "Discovery & Design":"#1E3A5F","Implementation":"#14532D","Project Management":"#451A03","Next Phase Recs":"#3B0764" };
const SOL_COLOR    = { AEM:"#FF4B00",CSC:"#A259FF",AEP:"#00C2FF",Commerce:"#00D085","Multi-Solution":"#FFB800" };
const REG_COLOR    = { NA:"#FF4B00",EMEA:"#A259FF",APAC:"#00C2FF",LATAM:"#00D085" };

const fmt  = n => n>=1e6?`$${(n/1e6).toFixed(1)}M`:n>=1e3?`$${(n/1e3).toFixed(0)}K`:`$${Math.round(n)}`;
const fmtH = n => n>=1000?`${(n/1000).toFixed(1)}K hrs`:`${n.toFixed(0)} hrs`;

function KPI({ label, value, sub, color, icon }) {
  return (
    <div style={{ background:"rgba(255,255,255,0.04)", border:"1px solid rgba(255,255,255,0.1)", borderRadius:14, padding:"18px 20px", flex:1, minWidth:130, borderTop:`3px solid ${color}` }}>
      <div style={{ fontSize:22, marginBottom:3 }}>{icon}</div>
      <div style={{ color:"#9ba3b8", fontSize:10, fontWeight:700, letterSpacing:"0.08em", textTransform:"uppercase", marginBottom:5 }}>{label}</div>
      <div style={{ color:"#fff", fontSize:24, fontWeight:900, lineHeight:1, fontFamily:"monospace" }}>{value}</div>
      {sub && <div style={{ color, fontSize:11, marginTop:5, fontWeight:600 }}>{sub}</div>}
    </div>
  );
}

function CT({ active, payload, label }) {
  if (!active || !payload?.length) return null;
  return (
    <div style={{ background:"#1a1f2e", border:"1px solid rgba(255,255,255,0.15)", borderRadius:10, padding:"10px 14px", fontSize:11 }}>
      <div style={{ color:"#9ba3b8", marginBottom:5, fontWeight:700 }}>{label}</div>
      {payload.map((p,i) => (
        <div key={i} style={{ color:p.color||"#fff", marginBottom:2 }}>
          {p.name}: <strong>{typeof p.value==="number"&&p.value>500?p.value.toLocaleString():typeof p.value==="number"?p.value.toFixed(1):p.value}</strong>
        </div>
      ))}
    </div>
  );
}

function Chip({ v, active, onClick, color }) {
  return (
    <button onClick={onClick} style={{ padding:"4px 12px", borderRadius:20, border:"1px solid", borderColor:active?color:"rgba(255,255,255,0.15)", background:active?`${color}22`:"transparent", color:active?color:"#9ba3b8", cursor:"pointer", fontSize:11, fontWeight:600, transition:"all 0.15s", whiteSpace:"nowrap" }}>{v}</button>
  );
}

function App() {
  const [sol, setSol]   = useState("All");
  const [reg, setReg]   = useState("All");
  const [qtr, setQtr]   = useState("All");
  const [phase, setPhase] = useState("All");
  const [tab, setTab]   = useState("overview");
  const [drillPhase, setDrillPhase] = useState(null);
  const [drillAct,   setDrillAct]   = useState(null);

  const base = useMemo(() => RAW.filter(d =>
    (sol==="All"||d.solution===sol) && (reg==="All"||d.region===reg) &&
    (qtr==="All"||d.quarter===qtr) && (phase==="All"||d.phase===phase)
  ), [sol,reg,qtr,phase]);

  const active = useMemo(() => {
    let d = base;
    if (drillPhase) d = d.filter(x => x.phase===drillPhase);
    if (drillAct)   d = d.filter(x => x.activity===drillAct);
    return d;
  }, [base, drillPhase, drillAct]);

  const kpi = useMemo(() => ({
    saved:   active.reduce((a,d)=>a+d.saved,0),
    cost:    active.reduce((a,d)=>a+d.cost,0),
    pct:     active.length ? active.reduce((a,d)=>a+d.pct,0)/active.length : 0,
    fte:     active.reduce((a,d)=>a+d.saved/160,0),
    quality: active.length ? active.reduce((a,d)=>a+d.quality,0)/active.length : 0,
    entries: active.length,
  }), [active]);

  const byPhase = useMemo(() => Object.keys(ACTIVITIES_BY_PHASE).map(ph => {
    const rows = active.filter(d=>d.phase===ph);
    return { name:ph, short:ph.replace(" & "," &\n").replace("Project ","PM\n").replace("Next Phase","Next\nPhase"), hours:rows.reduce((a,d)=>a+d.saved,0), cost:rows.reduce((a,d)=>a+d.cost,0), avg:rows.length?rows.reduce((a,d)=>a+d.pct,0)/rows.length:0, count:rows.length };
  }).filter(p=>p.count>0), [active]);

  const byActivity = useMemo(() => {
    const all = drillPhase ? ACTIVITIES_BY_PHASE[drillPhase] : Object.values(ACTIVITIES_BY_PHASE).flat();
    return all.map(act => {
      const rows = active.filter(d=>d.activity===act);
      if (!rows.length) return null;
      return { name:act.length>34?act.slice(0,32)+"…":act, full:act, hours:rows.reduce((a,d)=>a+d.saved,0), cost:rows.reduce((a,d)=>a+d.cost,0), avg:rows.length?rows.reduce((a,d)=>a+d.pct,0)/rows.length:0, quality:rows.length?rows.reduce((a,d)=>a+d.quality,0)/rows.length:0, count:rows.length, phase:rows[0].phase };
    }).filter(Boolean).sort((a,b)=>b.avg-a.avg);
  }, [active, drillPhase]);

  const bySolution = useMemo(() => SOLUTIONS.filter(s=>s!=="All").map(s => {
    const rows = active.filter(d=>d.solution===s);
    return { name:s, hours:rows.reduce((a,d)=>a+d.saved,0), cost:rows.reduce((a,d)=>a+d.cost,0), avg:rows.length?rows.reduce((a,d)=>a+d.pct,0)/rows.length:0, count:rows.length };
  }).filter(s=>s.count>0), [active]);

  const byQuarter = useMemo(() => QUARTERS.filter(q=>q!=="All").map(q => {
    const rows = active.filter(d=>d.quarter===q);
    return { name:q, hours:rows.reduce((a,d)=>a+d.saved,0), cost:rows.reduce((a,d)=>a+d.cost,0), avg:rows.length?rows.reduce((a,d)=>a+d.pct,0)/rows.length:0, count:rows.length };
  }).filter(q=>q.count>0), [active]);

  const radarData = useMemo(() => Object.keys(ACTIVITIES_BY_PHASE).map(ph => {
    const rows = base.filter(d=>d.phase===ph);
    return { subject: ph.replace(" & Design","").replace("Project ","PM ").replace("Next Phase Recs","Next Phase"), eff: rows.length?+(rows.reduce((a,d)=>a+d.pct,0)/rows.length).toFixed(0):0, quality: rows.length?+(rows.reduce((a,d)=>a+d.quality,0)/rows.length*20).toFixed(0):0 };
  }), [base]);

  const Tab = ({id,label}) => (
    <button onClick={()=>setTab(id)} style={{ padding:"7px 18px", borderRadius:7, border:"none", background:tab===id?"rgba(255,75,0,0.2)":"transparent", color:tab===id?"#FF4B00":"#9ba3b8", cursor:"pointer", fontSize:12, fontWeight:700 }}>{label}</button>
  );

  const hasDrill = drillPhase||drillAct;
  const clearDrill = () => { setDrillPhase(null); setDrillAct(null); };

  return (
    <div style={{ background:"#0b0f1a", minHeight:"100vh", fontFamily:"system-ui,sans-serif", color:"#fff", paddingBottom:48 }}>

      {/* ── HEADER ── */}
      <div style={{ background:"linear-gradient(135deg,#150800 0%,#0b0f1a 60%)", borderBottom:"1px solid rgba(255,75,0,0.25)", padding:"20px 28px 16px" }}>
        <div style={{ display:"flex", alignItems:"center", gap:12, marginBottom:14, flexWrap:"wrap" }}>
          <div style={{ width:38,height:38,background:"linear-gradient(135deg,#FF4B00,#FF7F50)",borderRadius:10,display:"flex",alignItems:"center",justifyContent:"center",fontSize:18 }}>⚡</div>
          <div>
            <div style={{ fontSize:18,fontWeight:900,letterSpacing:"-0.02em" }}>Adobe AI Efficiency <span style={{ color:"#FF4B00" }}>Gain Dashboard</span> <span style={{ fontSize:12,color:"#9ba3b8",fontWeight:400 }}>v2 · Activity Level</span></div>
            <div style={{ color:"#9ba3b8",fontSize:11,marginTop:1 }}>{active.length} activity records across {[...new Set(active.map(d=>d.project))].length} projects</div>
          </div>
          {hasDrill && (
            <div style={{ marginLeft:"auto",display:"flex",gap:8,alignItems:"center" }}>
              {drillPhase && <span style={{ background:`${PHASE_COLOR[drillPhase]}22`,border:`1px solid ${PHASE_COLOR[drillPhase]}`,borderRadius:8,padding:"4px 12px",fontSize:11,color:PHASE_COLOR[drillPhase],fontWeight:700 }}>Phase: {drillPhase}</span>}
              {drillAct   && <span style={{ background:"rgba(255,255,255,0.08)",border:"1px solid rgba(255,255,255,0.2)",borderRadius:8,padding:"4px 12px",fontSize:11,color:"#fff" }}>Activity: {drillAct.slice(0,30)}…</span>}
              <button onClick={clearDrill} style={{ background:"rgba(255,75,0,0.15)",border:"1px solid rgba(255,75,0,0.4)",borderRadius:8,padding:"4px 10px",color:"#FF4B00",cursor:"pointer",fontSize:11,fontWeight:700 }}>✕ Clear Drill</button>
            </div>
          )}
        </div>

        {/* Filters */}
        <div style={{ display:"flex",gap:12,flexWrap:"wrap",alignItems:"center" }}>
          {[["Solution",SOLUTIONS,sol,setSol,"#FF4B00"],["Region",REGIONS,reg,setReg,"#A259FF"],["Quarter",QUARTERS,qtr,setQtr,"#00C2FF"],["Phase",PHASES,phase,setPhase,"#F59E0B"]].map(([label,opts,val,setter,color])=>(
            <div key={label} style={{ display:"flex",gap:5,alignItems:"center" }}>
              <span style={{ color:"#9ba3b8",fontSize:10,fontWeight:700,letterSpacing:"0.08em",textTransform:"uppercase",minWidth:50 }}>{label}</span>
              {opts.map(o => <Chip key={o} v={o} active={val===o} onClick={()=>setter(o)} color={color} />)}
            </div>
          ))}
        </div>
      </div>

      <div style={{ padding:"20px 28px" }}>
        {/* KPIs */}
        <div style={{ display:"flex",gap:12,marginBottom:20,flexWrap:"wrap" }}>
          <KPI label="Hours Saved / Month" value={fmtH(kpi.saved)} sub={`${kpi.entries} activity records`} color="#FF4B00" icon="⏱" />
          <KPI label="Cost Savings" value={fmt(kpi.cost)} sub="Blended rate applied" color="#00D085" icon="💰" />
          <KPI label="Avg Efficiency Gain" value={`${kpi.pct.toFixed(1)}%`} sub="Across all activities" color="#A259FF" icon="📈" />
          <KPI label="FTE Equivalent" value={kpi.fte.toFixed(1)} sub="Full-time equivalents freed" color="#00C2FF" icon="👥" />
          <KPI label="Avg Quality Score" value={`${kpi.quality.toFixed(1)}/5`} sub="PM-rated improvement" color="#F59E0B" icon="⭐" />
        </div>

        {/* Phase KPI strip */}
        <div style={{ display:"flex",gap:10,marginBottom:20 }}>
          {Object.keys(ACTIVITIES_BY_PHASE).map(ph => {
            const rows = active.filter(d=>d.phase===ph);
            const phCost = rows.reduce((a,d)=>a+d.cost,0);
            const phPct  = rows.length ? rows.reduce((a,d)=>a+d.pct,0)/rows.length : 0;
            const isActive = drillPhase===ph;
            return (
              <div key={ph} onClick={()=>setDrillPhase(isActive?null:ph)} style={{ flex:1, background:isActive?`${PHASE_COLOR[ph]}18`:"rgba(255,255,255,0.03)", border:`1px solid ${isActive?PHASE_COLOR[ph]:"rgba(255,255,255,0.08)"}`, borderRadius:12, padding:"12px 16px", cursor:"pointer", transition:"all 0.2s", borderLeft:`4px solid ${PHASE_COLOR[ph]}` }}>
                <div style={{ fontSize:10,fontWeight:700,color:PHASE_COLOR[ph],textTransform:"uppercase",letterSpacing:"0.06em",marginBottom:6 }}>{ph}</div>
                <div style={{ display:"flex",justifyContent:"space-between",alignItems:"baseline" }}>
                  <div style={{ fontSize:20,fontWeight:900,color:"#fff" }}>{phPct.toFixed(0)}%</div>
                  <div style={{ fontSize:11,color:"#9ba3b8" }}>{rows.length} entries</div>
                </div>
                <div style={{ color:"#00D085",fontSize:11,fontWeight:600,marginTop:2 }}>{fmt(phCost)}</div>
                <div style={{ marginTop:8,height:4,background:"rgba(255,255,255,0.08)",borderRadius:2 }}>
                  <div style={{ height:"100%",width:`${Math.min(phPct,100)}%`,background:PHASE_COLOR[ph],borderRadius:2 }} />
                </div>
              </div>
            );
          })}
        </div>

        {/* Tabs */}
        <div style={{ display:"flex",gap:4,marginBottom:18,borderBottom:"1px solid rgba(255,255,255,0.07)",paddingBottom:0 }}>
          {[["overview","Overview"],["phases","Phase Analysis"],["activities","Activities"],["solutions","By Solution"],["trend","Trend"],["projects","Project Table"]].map(([id,l])=><Tab key={id} id={id} label={l} />)}
        </div>

        {/* ── OVERVIEW ── */}
        {tab==="overview" && (
          <div style={{ display:"grid",gridTemplateColumns:"1fr 1fr",gap:18 }}>
            <div style={{ background:"rgba(255,255,255,0.03)",border:"1px solid rgba(255,255,255,0.08)",borderRadius:14,padding:20 }}>
              <div style={{ fontSize:13,fontWeight:700,marginBottom:4 }}>Hours Saved by Phase</div>
              <div style={{ color:"#9ba3b8",fontSize:11,marginBottom:14 }}>Click to drill into phase</div>
              <ResponsiveContainer width="100%" height={210}>
                <BarChart data={byPhase} onClick={d=>d?.activeLabel&&setDrillPhase(byPhase.find(p=>p.short===d.activeLabel||p.name===d.activeLabel)?.name||null)}>
                  <CartesianGrid strokeDasharray="3 3" stroke="rgba(255,255,255,0.05)" />
                  <XAxis dataKey="name" tick={{ fill:"#9ba3b8",fontSize:9 }} tickFormatter={v=>v.length>16?v.slice(0,14)+"…":v} />
                  <YAxis tick={{ fill:"#9ba3b8",fontSize:9 }} />
                  <Tooltip content={<CT />} />
                  <Bar dataKey="hours" name="Hrs Saved" radius={[6,6,0,0]} cursor="pointer">
                    {byPhase.map((p,i)=><Cell key={i} fill={PHASE_COLOR[p.name]} fillOpacity={drillPhase===p.name?1:0.75} />)}
                  </Bar>
                </BarChart>
              </ResponsiveContainer>
            </div>
            <div style={{ background:"rgba(255,255,255,0.03)",border:"1px solid rgba(255,255,255,0.08)",borderRadius:14,padding:20 }}>
              <div style={{ fontSize:13,fontWeight:700,marginBottom:4 }}>Phase Performance Radar</div>
              <div style={{ color:"#9ba3b8",fontSize:11,marginBottom:14 }}>Efficiency % vs Quality score</div>
              <ResponsiveContainer width="100%" height={210}>
                <RadarChart data={radarData}>
                  <PolarGrid stroke="rgba(255,255,255,0.1)" />
                  <PolarAngleAxis dataKey="subject" tick={{ fill:"#9ba3b8",fontSize:10 }} />
                  <PolarRadiusAxis tick={{ fill:"#9ba3b8",fontSize:8 }} />
                  <Radar name="Efficiency%" dataKey="eff" stroke="#FF4B00" fill="#FF4B00" fillOpacity={0.25} />
                  <Radar name="Quality(scaled)" dataKey="quality" stroke="#A259FF" fill="#A259FF" fillOpacity={0.2} />
                  <Legend wrapperStyle={{ fontSize:10,color:"#9ba3b8" }} />
                </RadarChart>
              </ResponsiveContainer>
            </div>
            <div style={{ background:"rgba(255,255,255,0.03)",border:"1px solid rgba(255,255,255,0.08)",borderRadius:14,padding:20 }}>
              <div style={{ fontSize:13,fontWeight:700,marginBottom:4 }}>Cost Savings by Solution</div>
              <ResponsiveContainer width="100%" height={210}>
                <BarChart data={bySolution}>
                  <CartesianGrid strokeDasharray="3 3" stroke="rgba(255,255,255,0.05)" />
                  <XAxis dataKey="name" tick={{ fill:"#9ba3b8",fontSize:10 }} />
                  <YAxis tickFormatter={v=>fmt(v)} tick={{ fill:"#9ba3b8",fontSize:9 }} />
                  <Tooltip content={<CT />} formatter={v=>fmt(v)} />
                  <Bar dataKey="cost" name="Cost Saving" radius={[6,6,0,0]}>
                    {bySolution.map((s,i)=><Cell key={i} fill={SOL_COLOR[s.name]} fillOpacity={0.8} />)}
                  </Bar>
                </BarChart>
              </ResponsiveContainer>
            </div>
            <div style={{ background:"rgba(255,255,255,0.03)",border:"1px solid rgba(255,255,255,0.08)",borderRadius:14,padding:20 }}>
              <div style={{ fontSize:13,fontWeight:700,marginBottom:4 }}>Quarterly Trend</div>
              <ResponsiveContainer width="100%" height={210}>
                <AreaChart data={byQuarter}>
                  <defs><linearGradient id="g1" x1="0" y1="0" x2="0" y2="1"><stop offset="5%" stopColor="#FF4B00" stopOpacity={0.3}/><stop offset="95%" stopColor="#FF4B00" stopOpacity={0}/></linearGradient></defs>
                  <CartesianGrid strokeDasharray="3 3" stroke="rgba(255,255,255,0.05)" />
                  <XAxis dataKey="name" tick={{ fill:"#9ba3b8",fontSize:10 }} />
                  <YAxis tickFormatter={v=>`${v.toFixed(0)}%`} tick={{ fill:"#9ba3b8",fontSize:9 }} />
                  <Tooltip content={<CT />} />
                  <Area type="monotone" dataKey="avg" name="Avg Efficiency %" stroke="#FF4B00" fill="url(#g1)" strokeWidth={2} dot={{ fill:"#FF4B00",r:4 }} />
                </AreaChart>
              </ResponsiveContainer>
            </div>
          </div>
        )}

        {/* ── PHASE ANALYSIS ── */}
        {tab==="phases" && (
          <div style={{ display:"grid",gridTemplateColumns:"1fr 1fr",gap:18 }}>
            {Object.entries(ACTIVITIES_BY_PHASE).map(([ph,acts])=>{
              const phRows = active.filter(d=>d.phase===ph);
              if (!phRows.length) return null;
              const phCost = phRows.reduce((a,d)=>a+d.cost,0);
              const phPct  = phRows.length?phRows.reduce((a,d)=>a+d.pct,0)/phRows.length:0;
              const isActive = drillPhase===ph;
              const actData = acts.map(a=>{ const r=phRows.filter(d=>d.activity===a); return r.length?{name:a.length>28?a.slice(0,26)+"…":a,full:a,avg:r.reduce((x,d)=>x+d.pct,0)/r.length,cost:r.reduce((x,d)=>x+d.cost,0),count:r.length}:null; }).filter(Boolean);
              return (
                <div key={ph} onClick={()=>setDrillPhase(isActive?null:ph)} style={{ background:isActive?`${PHASE_COLOR[ph]}10`:"rgba(255,255,255,0.03)", border:`1px solid ${isActive?PHASE_COLOR[ph]:"rgba(255,255,255,0.08)"}`, borderRadius:14, padding:20, cursor:"pointer", transition:"all 0.2s" }}>
                  <div style={{ display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:4 }}>
                    <div style={{ fontSize:14,fontWeight:800,color:PHASE_COLOR[ph] }}>{ph}</div>
                    <span style={{ fontSize:11,color:"#9ba3b8" }}>{phRows.length} entries · {fmt(phCost)}</span>
                  </div>
                  <div style={{ fontSize:22,fontWeight:900,marginBottom:14 }}>{phPct.toFixed(1)}<span style={{ fontSize:13,color:"#9ba3b8" }}>% avg gain</span></div>
                  {actData.length>0 && (
                    <ResponsiveContainer width="100%" height={160}>
                      <BarChart data={actData} layout="vertical" onClick={e=>e?.activeLabel&&setDrillAct(actData.find(a=>a.name===e.activeLabel)?.full||null)}>
                        <XAxis type="number" tickFormatter={v=>`${v.toFixed(0)}%`} tick={{ fill:"#9ba3b8",fontSize:8 }} />
                        <YAxis type="category" dataKey="name" tick={{ fill:"#9ba3b8",fontSize:8 }} width={110} />
                        <Tooltip content={<CT />} />
                        <Bar dataKey="avg" name="Efficiency %" radius={[0,4,4,0]} fill={PHASE_COLOR[ph]} fillOpacity={0.8} cursor="pointer" />
                      </BarChart>
                    </ResponsiveContainer>
                  )}
                </div>
              );
            })}
          </div>
        )}

        {/* ── ACTIVITIES ── */}
        {tab==="activities" && (
          <div>
            <div style={{ display:"flex",gap:8,marginBottom:14,flexWrap:"wrap" }}>
              {Object.keys(ACTIVITIES_BY_PHASE).map(ph=>(
                <button key={ph} onClick={()=>setDrillPhase(drillPhase===ph?null:ph)} style={{ padding:"5px 14px",borderRadius:20,border:"1px solid",borderColor:drillPhase===ph?PHASE_COLOR[ph]:"rgba(255,255,255,0.15)",background:drillPhase===ph?`${PHASE_COLOR[ph]}22`:"transparent",color:drillPhase===ph?PHASE_COLOR[ph]:"#9ba3b8",cursor:"pointer",fontSize:11,fontWeight:600 }}>{ph}</button>
              ))}
              {drillPhase && <button onClick={()=>{setDrillPhase(null);setDrillAct(null);}} style={{ padding:"5px 12px",borderRadius:20,border:"1px solid rgba(255,75,0,0.4)",background:"rgba(255,75,0,0.1)",color:"#FF4B00",cursor:"pointer",fontSize:11,fontWeight:600 }}>✕ All Phases</button>}
            </div>
            <div style={{ display:"grid",gridTemplateColumns:"1fr 1fr",gap:18,marginBottom:18 }}>
              <div style={{ background:"rgba(255,255,255,0.03)",border:"1px solid rgba(255,255,255,0.08)",borderRadius:14,padding:20 }}>
                <div style={{ fontSize:13,fontWeight:700,marginBottom:4 }}>Top Activities by Efficiency Gain %</div>
                <div style={{ color:"#9ba3b8",fontSize:11,marginBottom:12 }}>Click bar to drill into activity</div>
                <ResponsiveContainer width="100%" height={Math.max(220,byActivity.slice(0,10).length*26)}>
                  <BarChart data={byActivity.slice(0,10)} layout="vertical" onClick={e=>e?.activeLabel&&setDrillAct(byActivity.find(a=>a.name===e.activeLabel)?.full||null)}>
                    <CartesianGrid strokeDasharray="3 3" stroke="rgba(255,255,255,0.05)" horizontal={false} />
                    <XAxis type="number" tickFormatter={v=>`${v.toFixed(0)}%`} tick={{ fill:"#9ba3b8",fontSize:8 }} />
                    <YAxis type="category" dataKey="name" tick={{ fill:"#9ba3b8",fontSize:8 }} width={130} />
                    <Tooltip content={<CT />} />
                    <Bar dataKey="avg" name="Efficiency %" radius={[0,5,5,0]} cursor="pointer">
                      {byActivity.slice(0,10).map((a,i)=><Cell key={i} fill={PHASE_COLOR[a.phase]} fillOpacity={drillAct===a.full?1:0.75} />)}
                    </Bar>
                  </BarChart>
                </ResponsiveContainer>
              </div>
              <div style={{ background:"rgba(255,255,255,0.03)",border:"1px solid rgba(255,255,255,0.08)",borderRadius:14,padding:20 }}>
                <div style={{ fontSize:13,fontWeight:700,marginBottom:4 }}>Cost Saving by Activity</div>
                <ResponsiveContainer width="100%" height={Math.max(220,byActivity.slice(0,10).length*26)}>
                  <BarChart data={byActivity.slice(0,10)} layout="vertical">
                    <CartesianGrid strokeDasharray="3 3" stroke="rgba(255,255,255,0.05)" horizontal={false} />
                    <XAxis type="number" tickFormatter={v=>fmt(v)} tick={{ fill:"#9ba3b8",fontSize:8 }} />
                    <YAxis type="category" dataKey="name" tick={{ fill:"#9ba3b8",fontSize:8 }} width={130} />
                    <Tooltip content={<CT />} formatter={v=>fmt(v)} />
                    <Bar dataKey="cost" name="Cost Saving" radius={[0,5,5,0]}>
                      {byActivity.slice(0,10).map((a,i)=><Cell key={i} fill={PHASE_COLOR[a.phase]} fillOpacity={0.6} />)}
                    </Bar>
                  </BarChart>
                </ResponsiveContainer>
              </div>
            </div>

            {/* Activity detail table */}
            <div style={{ background:"rgba(255,255,255,0.03)",border:"1px solid rgba(255,255,255,0.08)",borderRadius:14,overflow:"hidden" }}>
              <div style={{ padding:"14px 18px",borderBottom:"1px solid rgba(255,255,255,0.07)",display:"flex",justifyContent:"space-between",alignItems:"center" }}>
                <span style={{ fontSize:13,fontWeight:700 }}>All Activities Detail</span>
                <span style={{ fontSize:11,color:"#9ba3b8" }}>{byActivity.length} activities with data</span>
              </div>
              <table style={{ width:"100%",borderCollapse:"collapse" }}>
                <thead>
                  <tr style={{ background:"rgba(255,255,255,0.05)" }}>
                    {["Phase","Activity","Entries","Hrs Saved/Mo","Avg Eff %","Cost Saved","Avg Quality"].map(h=>(
                      <th key={h} style={{ padding:"10px 14px",fontSize:9,fontWeight:700,color:"#9ba3b8",letterSpacing:"0.07em",textTransform:"uppercase",textAlign:"left",borderBottom:"1px solid rgba(255,255,255,0.08)" }}>{h}</th>
                    ))}
                  </tr>
                </thead>
                <tbody>
                  {byActivity.map((a,i)=>(
                    <tr key={i} onClick={()=>setDrillAct(drillAct===a.full?null:a.full)} style={{ borderBottom:"1px solid rgba(255,255,255,0.04)",cursor:"pointer",background:drillAct===a.full?`${PHASE_COLOR[a.phase]}10`:"transparent",transition:"background 0.15s" }}
                      onMouseEnter={e=>e.currentTarget.style.background=drillAct===a.full?`${PHASE_COLOR[a.phase]}10`:"rgba(255,255,255,0.03)"}
                      onMouseLeave={e=>e.currentTarget.style.background=drillAct===a.full?`${PHASE_COLOR[a.phase]}10`:"transparent"}>
                      <td style={{ padding:"10px 14px" }}><span style={{ background:`${PHASE_COLOR[a.phase]}22`,color:PHASE_COLOR[a.phase],padding:"2px 8px",borderRadius:10,fontSize:9,fontWeight:700 }}>{a.phase.replace(" & Design","").replace("Project ","PM ")}</span></td>
                      <td style={{ padding:"10px 14px",fontSize:11,fontWeight:600,maxWidth:240 }}>{a.full}</td>
                      <td style={{ padding:"10px 14px",fontSize:11,color:"#9ba3b8",textAlign:"center" }}>{a.count}</td>
                      <td style={{ padding:"10px 14px",fontSize:11,fontFamily:"monospace",color:"#00C2FF",textAlign:"center" }}>{a.hours.toFixed(1)}</td>
                      <td style={{ padding:"10px 14px" }}>
                        <div style={{ display:"flex",alignItems:"center",gap:8 }}>
                          <div style={{ flex:1,height:5,background:"rgba(255,255,255,0.08)",borderRadius:3 }}>
                            <div style={{ width:`${Math.min(a.avg,100)}%`,height:"100%",background:a.avg>70?"#00D085":a.avg>40?"#F59E0B":"#FF4B00",borderRadius:3 }} />
                          </div>
                          <span style={{ fontSize:11,fontWeight:700,minWidth:34,color:a.avg>70?"#00D085":a.avg>40?"#F59E0B":"#FF4B00" }}>{a.avg.toFixed(0)}%</span>
                        </div>
                      </td>
                      <td style={{ padding:"10px 14px",fontSize:11,fontWeight:600,color:"#00D085",fontFamily:"monospace" }}>{fmt(a.cost)}</td>
                      <td style={{ padding:"10px 14px",fontSize:11,textAlign:"center" }}>{"⭐".repeat(Math.round(a.quality))}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>
        )}

        {/* ── SOLUTIONS ── */}
        {tab==="solutions" && (
          <div style={{ display:"grid",gridTemplateColumns:"1fr 1fr",gap:18 }}>
            <div style={{ background:"rgba(255,255,255,0.03)",border:"1px solid rgba(255,255,255,0.08)",borderRadius:14,padding:20 }}>
              <div style={{ fontSize:13,fontWeight:700,marginBottom:16 }}>Hours Saved per Solution</div>
              <ResponsiveContainer width="100%" height={260}>
                <BarChart data={bySolution} layout="vertical">
                  <CartesianGrid strokeDasharray="3 3" stroke="rgba(255,255,255,0.05)" horizontal={false} />
                  <XAxis type="number" tick={{ fill:"#9ba3b8",fontSize:9 }} />
                  <YAxis type="category" dataKey="name" tick={{ fill:"#9ba3b8",fontSize:11 }} width={80} />
                  <Tooltip content={<CT />} />
                  <Bar dataKey="hours" name="Hrs Saved" radius={[0,6,6,0]}>
                    {bySolution.map((s,i)=><Cell key={i} fill={SOL_COLOR[s.name]} />)}
                  </Bar>
                </BarChart>
              </ResponsiveContainer>
            </div>
            <div style={{ background:"rgba(255,255,255,0.03)",border:"1px solid rgba(255,255,255,0.08)",borderRadius:14,padding:20 }}>
              <div style={{ fontSize:13,fontWeight:700,marginBottom:16 }}>Avg Efficiency % by Solution</div>
              <ResponsiveContainer width="100%" height={260}>
                <BarChart data={bySolution}>
                  <CartesianGrid strokeDasharray="3 3" stroke="rgba(255,255,255,0.05)" />
                  <XAxis dataKey="name" tick={{ fill:"#9ba3b8",fontSize:11 }} />
                  <YAxis tickFormatter={v=>`${v.toFixed(0)}%`} tick={{ fill:"#9ba3b8",fontSize:9 }} />
                  <Tooltip content={<CT />} />
                  <Bar dataKey="avg" name="Avg Efficiency %" radius={[6,6,0,0]}>
                    {bySolution.map((s,i)=><Cell key={i} fill={SOL_COLOR[s.name]} fillOpacity={0.8} />)}
                  </Bar>
                </BarChart>
              </ResponsiveContainer>
            </div>
            {bySolution.map(s=>(
              <div key={s.name} style={{ background:"rgba(255,255,255,0.03)",border:"1px solid rgba(255,255,255,0.08)",borderRadius:14,padding:20 }}>
                <div style={{ fontSize:15,fontWeight:800,color:SOL_COLOR[s.name],marginBottom:12 }}>{s.name} <span style={{ fontSize:11,color:"#9ba3b8",fontWeight:400 }}>· {s.count} records</span></div>
                <div style={{ display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:10 }}>
                  {[["Hrs Saved",s.hours.toFixed(0)+" hrs"],["Avg Gain",s.avg.toFixed(1)+"%"],["Cost Saved",fmt(s.cost)]].map(([l,v])=>(
                    <div key={l}><div style={{ color:"#9ba3b8",fontSize:10 }}>{l}</div><div style={{ color:"#fff",fontSize:18,fontWeight:800 }}>{v}</div></div>
                  ))}
                </div>
                {/* phase breakdown for this solution */}
                <div style={{ marginTop:14 }}>
                  {Object.keys(ACTIVITIES_BY_PHASE).map(ph=>{
                    const rows = active.filter(d=>d.solution===s.name&&d.phase===ph);
                    if (!rows.length) return null;
                    const pp = rows.reduce((a,d)=>a+d.pct,0)/rows.length;
                    return (
                      <div key={ph} style={{ display:"flex",alignItems:"center",gap:10,marginBottom:6 }}>
                        <span style={{ fontSize:9,color:PHASE_COLOR[ph],minWidth:80,fontWeight:600 }}>{ph.replace(" & Design","").replace("Project ","PM ")}</span>
                        <div style={{ flex:1,height:4,background:"rgba(255,255,255,0.08)",borderRadius:2 }}>
                          <div style={{ width:`${Math.min(pp,100)}%`,height:"100%",background:PHASE_COLOR[ph],borderRadius:2 }} />
                        </div>
                        <span style={{ fontSize:9,color:"#9ba3b8",minWidth:30 }}>{pp.toFixed(0)}%</span>
                      </div>
                    );
                  })}
                </div>
              </div>
            ))}
          </div>
        )}

        {/* ── TREND ── */}
        {tab==="trend" && (
          <div style={{ display:"grid",gridTemplateColumns:"1fr",gap:18 }}>
            <div style={{ background:"rgba(255,255,255,0.03)",border:"1px solid rgba(255,255,255,0.08)",borderRadius:14,padding:24 }}>
              <div style={{ fontSize:13,fontWeight:700,marginBottom:4 }}>Quarterly Trend — Hours Saved & Cost Saving</div>
              <ResponsiveContainer width="100%" height={300}>
                <LineChart data={byQuarter}>
                  <CartesianGrid strokeDasharray="3 3" stroke="rgba(255,255,255,0.05)" />
                  <XAxis dataKey="name" tick={{ fill:"#9ba3b8",fontSize:10 }} />
                  <YAxis yAxisId="left" tick={{ fill:"#9ba3b8",fontSize:9 }} />
                  <YAxis yAxisId="right" orientation="right" tickFormatter={v=>fmt(v)} tick={{ fill:"#9ba3b8",fontSize:9 }} />
                  <Tooltip content={<CT />} />
                  <Legend wrapperStyle={{ fontSize:11,color:"#9ba3b8" }} />
                  <Line yAxisId="left"  type="monotone" dataKey="hours" name="Hours Saved" stroke="#FF4B00" strokeWidth={2.5} dot={{ fill:"#FF4B00",r:5 }} />
                  <Line yAxisId="right" type="monotone" dataKey="cost"  name="Cost Saving ($)" stroke="#00D085" strokeWidth={2.5} dot={{ fill:"#00D085",r:5 }} />
                  <Line yAxisId="left"  type="monotone" dataKey="avg"   name="Avg Eff %" stroke="#A259FF" strokeWidth={2} strokeDasharray="5 5" dot={{ fill:"#A259FF",r:4 }} />
                </LineChart>
              </ResponsiveContainer>
            </div>
            <div style={{ display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(160px,1fr))",gap:12 }}>
              {byQuarter.map((q,i)=>(
                <div key={q.name} style={{ background:"rgba(255,255,255,0.03)",border:"1px solid rgba(255,255,255,0.08)",borderRadius:12,padding:16,textAlign:"center" }}>
                  <div style={{ color:["#FF4B00","#A259FF","#00C2FF","#00D085","#F59E0B"][i%5],fontWeight:800,fontSize:12,marginBottom:8 }}>{q.name}</div>
                  <div style={{ fontSize:22,fontWeight:900 }}>{q.avg.toFixed(1)}%</div>
                  <div style={{ color:"#9ba3b8",fontSize:10,marginBottom:4 }}>Avg Gain</div>
                  <div style={{ color:"#00D085",fontSize:13,fontWeight:700 }}>{fmt(q.cost)}</div>
                  <div style={{ color:"#9ba3b8",fontSize:10,marginBottom:4 }}>Cost Saved</div>
                  <div style={{ color:"#00C2FF",fontSize:13,fontWeight:600 }}>{q.count} activities</div>
                </div>
              ))}
            </div>
          </div>
        )}

        {/* ── PROJECT TABLE ── */}
        {tab==="projects" && (
          <div style={{ background:"rgba(255,255,255,0.03)",border:"1px solid rgba(255,255,255,0.08)",borderRadius:14,overflow:"hidden" }}>
            <table style={{ width:"100%",borderCollapse:"collapse" }}>
              <thead>
                <tr style={{ background:"rgba(255,255,255,0.06)" }}>
                  {["Project","Solution","Region","Quarter","Phase","Activity","Baseline Hrs","Current Hrs","Saved/Mo","Eff %","Cost Saved","Quality","PM","Notes"].map(h=>(
                    <th key={h} style={{ padding:"10px 12px",fontSize:9,fontWeight:700,color:"#9ba3b8",letterSpacing:"0.07em",textTransform:"uppercase",textAlign:"left",borderBottom:"1px solid rgba(255,255,255,0.08)",whiteSpace:"nowrap" }}>{h}</th>
                  ))}
                </tr>
              </thead>
              <tbody>
                {active.map((d,i)=>(
                  <tr key={i} style={{ borderBottom:"1px solid rgba(255,255,255,0.04)",transition:"background 0.12s" }}
                    onMouseEnter={e=>e.currentTarget.style.background="rgba(255,255,255,0.03)"}
                    onMouseLeave={e=>e.currentTarget.style.background="transparent"}>
                    <td style={{ padding:"9px 12px",fontSize:11,fontWeight:600,maxWidth:140,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap" }}>{d.project}</td>
                    <td style={{ padding:"9px 12px" }}><span style={{ background:`${SOL_COLOR[d.solution]}22`,color:SOL_COLOR[d.solution],padding:"2px 8px",borderRadius:10,fontSize:9,fontWeight:700 }}>{d.solution}</span></td>
                    <td style={{ padding:"9px 12px",color:"#9ba3b8",fontSize:10 }}>{d.region}</td>
                    <td style={{ padding:"9px 12px",color:"#9ba3b8",fontSize:10 }}>{d.quarter}</td>
                    <td style={{ padding:"9px 12px" }}><span style={{ background:`${PHASE_COLOR[d.phase]}22`,color:PHASE_COLOR[d.phase],padding:"2px 8px",borderRadius:10,fontSize:9,fontWeight:700 }}>{d.phase.replace(" & Design","").replace("Project ","PM ").replace("Next Phase Recs","Next")}</span></td>
                    <td style={{ padding:"9px 12px",fontSize:10,maxWidth:180,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap" }}>{d.activity}</td>
                    <td style={{ padding:"9px 12px",fontSize:10,fontFamily:"monospace",textAlign:"center" }}>{(d.baseHr*d.baseFreq).toFixed(0)}</td>
                    <td style={{ padding:"9px 12px",fontSize:10,fontFamily:"monospace",textAlign:"center" }}>{(d.curHr*d.curFreq).toFixed(0)}</td>
                    <td style={{ padding:"9px 12px",fontSize:10,fontWeight:700,color:"#00D085",fontFamily:"monospace",textAlign:"center" }}>{d.saved.toFixed(1)}</td>
                    <td style={{ padding:"9px 12px" }}>
                      <div style={{ display:"flex",alignItems:"center",gap:6 }}>
                        <div style={{ flex:1,height:4,background:"rgba(255,255,255,0.08)",borderRadius:2,minWidth:40 }}>
                          <div style={{ width:`${Math.min(d.pct,100)}%`,height:"100%",background:d.pct>70?"#00D085":d.pct>40?"#F59E0B":"#FF4B00",borderRadius:2 }} />
                        </div>
                        <span style={{ fontSize:9,fontWeight:700,color:d.pct>70?"#00D085":d.pct>40?"#F59E0B":"#FF4B00",minWidth:28 }}>{d.pct.toFixed(0)}%</span>
                      </div>
                    </td>
                    <td style={{ padding:"9px 12px",fontSize:10,color:"#00D085",fontWeight:600,fontFamily:"monospace" }}>{fmt(d.cost)}</td>
                    <td style={{ padding:"9px 12px",fontSize:10 }}>{"⭐".repeat(d.quality)}</td>
                    <td style={{ padding:"9px 12px",fontSize:10,color:"#9ba3b8" }}>{d.pm}</td>
                    <td style={{ padding:"9px 12px",fontSize:9,color:"#6b7280",maxWidth:160,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap" }}>{d.notes}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        )}
      </div>
    </div>
  );
}


ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
